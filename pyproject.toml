[project]
name = "resilient-client"
version = "0.1.0"
description = "Production-grade async HTTP client"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resilient_client"]
